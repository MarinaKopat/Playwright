name: Pylint

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3 # Можно обновить до v5 для скорости
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pylint
        # Если есть зависимости в проекте, их нужно установить,
        # иначе Pylint может выдать ошибку импорта
        [ -f requirements.txt ] && pip install -r requirements.txt || true
    - name: Analysing the code with pylint
      run: |
        # Устанавливаем PYTHONPATH в корень репозитория
        export PYTHONPATH=$PYTHONPATH:$(pwd)
        # Запускаем через python -m для корректного разрешения путей
        python -m pylint $(git ls-files '*.py')
